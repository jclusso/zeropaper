name: zeropaper

services:
  app:
    # Published for amd64 and arm64 on every push to master. `docker compose
    # pull` fetches it; `docker compose up --build` builds this checkout instead.
    image: ghcr.io/jclusso/zeropaper:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://zeropaper:${POSTGRES_PASSWORD}@db/zeropaper_production
      DOCLING_URL: http://docling:5001
      MODELS_DIR: /rails/storage/models
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Uploaded files, encrypted private files and the embedding model cache.
      - storage:/rails/storage
      # Drop files here to import them. Files in ./ingest/private are marked private.
      - ./ingest:/rails/storage/ingest
      # Backups. Change the left side to keep them elsewhere, such as a NAS share.
      - ./backups:/rails/storage/backups
    depends_on:
      db:
        condition: service_healthy
      docling:
        condition: service_started

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: zeropaper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: zeropaper_production
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeropaper -d zeropaper_production"]
      interval: 5s
      timeout: 5s
      retries: 20

  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.37.0
    restart: unless-stopped
    environment:
      DOCLING_SERVE_MAX_SYNC_WAIT: "900"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

volumes:
  storage:
  postgres:

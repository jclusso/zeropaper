default: &default
  ingest_folder:
    class: IngestFolderJob
    # Files wait 10 seconds to settle before import, so polling faster than
    # this would not be noticed.
    schedule: every 5 seconds
  recover_stuck_documents:
    class: RecoverStuckDocumentsJob
    schedule: every 5 minutes
  recover_stuck_research:
    class: RecoverStuckResearchJob
    schedule: every 5 minutes
  expire_sessions:
    class: ExpireSessionsJob
    schedule: every hour at minute 23
  scheduled_backup:
    class: ScheduledBackupJob
    schedule: every hour at minute 7

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

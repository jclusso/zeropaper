default: &default
  ingest_folder:
    class: IngestFolderJob
    schedule: every minute
  recover_stuck_documents:
    class: RecoverStuckDocumentsJob
    schedule: every 5 minutes
  recover_stuck_research:
    class: RecoverStuckResearchJob
    schedule: every 5 minutes
  scheduled_backup:
    class: ScheduledBackupJob
    schedule: every hour at minute 7

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

# A git worktree gets its own databases, named after its folder. bin/worktree
# copies the main checkout's development database into it.
<% worktree = Rails.root.join(".git").file? ? "_#{Rails.root.basename.to_s.gsub(/\W/, "_")[0, 30]}" : "" %>

default: &default
  adapter: postgresql
  encoding: unicode
  # Enough for the web threads or the processing worker threads, whichever is larger.
  max_connections: <%= [ ENV.fetch("RAILS_MAX_THREADS", 5).to_i, ENV.fetch("PROCESSING_THREADS", 6).to_i ].max + 5 %>

development:
  <<: *default
  database: zeropaper_development<%= worktree %>

test:
  <<: *default
  database: zeropaper_test<%= worktree %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
